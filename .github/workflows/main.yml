cat > .github/workflows/build_windows_exe.yml << 'EOF'
name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # allows manual trigger

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl PyQt5 pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name LeaveBalance leave_calculator.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeaveBalance-Windows
          path: dist/LeaveBalance.exe
EOF
